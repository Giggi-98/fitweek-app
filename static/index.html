<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#11171a" />
    <meta name="description" content="FitWeek - palestra, pasti, spesa e progressi" />
    <title>FitWeek · La tua settimana, sotto controllo</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="login" class="login-shell hidden">
      <div class="login-card">
        <div class="brand-logo large">◈</div>
        <h1>FitWeek</h1>
        <p>La tua settimana, sotto controllo.</p>
        <form id="login-form">
          <label
            >Password di accesso<input
              type="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Inserisci la password" /></label
          ><button class="btn primary full">Entra nell'app <span>→</span></button>
          <p class="error" id="login-error"></p>
        </form>
      </div>
    </div>
    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-logo">◈</span
          ><span>Fit<span class="accent">Week</span><small>PERSONAL DASHBOARD</small></span>
        </div>
        <nav id="nav">
          <button data-view="dashboard" class="navitem selected"><span>▦</span> Panoramica</button
          ><button data-view="training" class="navitem"><span>◆</span> Allenamenti</button
          ><button data-view="meals" class="navitem"><span>◉</span> Alimentazione</button
          ><button data-view="shopping" class="navitem"><span>▤</span> Spesa & dispensa</button
          ><button data-view="progress" class="navitem"><span>↗</span> Progressi</button
          ><button data-view="settings" class="navitem"><span>⚙</span> Impostazioni</button>
        </nav>
        <div class="side-bottom">
          <div class="side-note">
            <span class="tiny-label">LA TUA ROUTINE</span><strong>Lun · Mer · Ven</strong
            ><span>19:30 – 22:00</span>
          </div>
          <button id="logout" class="quiet">Esci ↗</button>
        </div>
      </aside>
      <div class="app-main">
        <header class="topbar">
          <div>
            <span class="top-eyebrow">YOUR WEEKLY SYSTEM</span>
            <h1 id="page-title">Panoramica</h1>
          </div>
          <div class="top-actions">
            <span id="sync" class="sync">● Sincronizzato</span>
            <div class="avatar">F</div>
          </div>
        </header>
        <main id="content"></main>
        <footer>
          FitWeek · I dati restano sul tuo server · Le indicazioni alimentari sono orientative, non una
          prescrizione medica
        </footer>
      </div>
      <nav class="bottom-nav" id="bottom-nav">
        <button data-view="dashboard" class="active">▦<small>Home</small></button
        ><button data-view="training">◆<small>Palestra</small></button
        ><button data-view="meals">◉<small>Pasti</small></button
        ><button data-view="shopping">▤<small>Spesa</small></button
        ><button data-view="progress">↗<small>Progressi</small></button
        ><button data-view="settings">⚙<small>Altro</small></button>
      </nav>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script defer src="/static/app.js"></script>
  </body>
</html>
