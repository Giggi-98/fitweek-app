<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4f0" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="FitWeek — palestra, pasti, spesa e progressi" />
    <title>FitWeek</title>
    <link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body>
    <div id="boot" class="boot" role="status">Caricamento…</div>

    <div id="login" class="login-shell hidden">
      <div class="login-card">
        <div class="brand-logo large" data-icon="dumbbell"></div>
        <h1>FitWeek</h1>
        <p>La tua settimana, sotto controllo.</p>
        <form id="login-form">
          <label for="pw">Password</label>
          <input id="pw" type="password" name="password" required autocomplete="current-password" />
          <button class="btn primary xl full" type="submit">Entra</button>
          <p class="error" id="login-error" role="alert"></p>
        </form>
      </div>
    </div>

    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <div class="brand"><span class="brand-logo" data-icon="dumbbell"></span><span>Fit<span class="accent">Week</span></span></div>
        <nav aria-label="Principale">
          <a href="#dashboard" data-view="dashboard" class="navitem"><span data-icon="sun"></span>Oggi</a>
          <a href="#training" data-view="training" class="navitem"><span data-icon="dumbbell"></span>Palestra</a>
          <a href="#meals" data-view="meals" class="navitem"><span data-icon="utensils"></span>Pasti</a>
          <a href="#shopping" data-view="shopping" class="navitem"><span data-icon="shopping-cart"></span>Spesa e dispensa</a>
          <a href="#progress" data-view="progress" class="navitem"><span data-icon="trending-up"></span>Progressi</a>
          <a href="#settings" data-view="settings" class="navitem"><span data-icon="settings"></span>Impostazioni</a>
        </nav>
        <div class="side-bottom">
          <div class="side-note"><span class="eyebrow">Palestra</span><strong>Lun · Mer · Ven</strong><span>19:30–22:00</span></div>
          <button id="logout" class="btn small ghost" type="button"><span data-icon="log-out"></span>Esci</button>
        </div>
      </aside>
      <div class="app-main">
        <header class="topbar">
          <div><div id="page-eyebrow" class="eyebrow"></div><h1 id="page-title">Oggi</h1></div>
          <div class="top-actions">
            <span id="sync" class="sync" role="status" aria-live="polite" data-state="ok"><span class="sync-text">Sincronizzato</span></span>
            <a href="#settings" data-view="settings" class="icon-btn mobile-only" aria-label="Impostazioni"><span data-icon="settings"></span></a>
          </div>
        </header>
        <main id="content"></main>
      </div>
      <div id="rest-bar" class="rest-bar hidden" role="timer" aria-live="polite">
        <div class="rest-progress"><div id="rest-progress"></div></div>
        <div class="rest-row">
          <span id="rest-label">Recupero</span>
          <strong id="rest-time">1:30</strong>
          <button id="rest-plus" class="btn small" type="button">+15 s</button>
          <button id="rest-stop" class="btn small ghost" type="button">Stop</button>
        </div>
      </div>
      <nav class="bottom-nav" aria-label="Principale">
        <a href="#dashboard" data-view="dashboard"><span data-icon="sun"></span><small>Oggi</small></a>
        <a href="#training" data-view="training"><span data-icon="dumbbell"></span><small>Palestra</small></a>
        <a href="#meals" data-view="meals"><span data-icon="utensils"></span><small>Pasti</small></a>
        <a href="#shopping" data-view="shopping"><span data-icon="shopping-cart"></span><small>Spesa</small></a>
        <a href="#progress" data-view="progress"><span data-icon="trending-up"></span><small>Progressi</small></a>
      </nav>
    </div>
    <dialog id="modal" class="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </body>
</html>
