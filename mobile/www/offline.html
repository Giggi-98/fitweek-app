<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitWeek · server non raggiungibile</title>
<style>
  :root { color-scheme: dark light; --bg:#0f1513; --text:#eef4f0; --muted:#9aaba5; --accent:#b8ee7b; --on:#11260f; --card:#172120; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f2; --text:#17201c; --muted:#56635d; --accent:#3f7d1f; --on:#fff; --card:#fff; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; padding:24px; box-sizing:border-box; }
  .card { max-width:420px; background:var(--card); border-radius:18px; padding:28px 22px; text-align:center; }
  .logo { width:56px; height:56px; border-radius:14px; background:var(--accent); color:var(--on); display:grid; place-items:center; font-size:32px; font-weight:800; margin:0 auto 12px; }
  p { color:var(--muted); }
  button { width:100%; min-height:52px; border:0; border-radius:14px; background:var(--accent); color:var(--on); font:600 16px system-ui; margin-top:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">◈</div>
    <h1>Server non raggiungibile</h1>
    <p>FitWeek funziona collegandosi al server di casa. Sei sulla Wi-Fi di casa, oppure con la VPN attiva?</p>
    <p>Le notifiche dei promemoria continuano ad arrivare anche così.</p>
    <button onclick="location.href=window.FITWEEK_URL||'/'">Riprova</button>
  </div>
</body>
</html>
