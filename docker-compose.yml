services:
  fitweek:
    build: .
    container_name: fitweek
    restart: unless-stopped
    env_file: .env
    ports:
      - "192.168.222.200:8088:8080"
    volumes:
      - fitweek_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  fitweek_data:
